<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yote.</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#f5f5f0;color:#111;}

/* ローディング */
#screen-loading{position:fixed;inset:0;background:#f5f5f0;display:flex;align-items:center;justify-content:center;z-index:999;transition:opacity 0.2s;}
#screen-loading.hide{opacity:0;pointer-events:none;}
.loading-logo{font-size:32px;font-weight:700;letter-spacing:-1px;color:#111;}

.screen{display:none;flex-direction:column;height:100vh;height:100dvh;background:#fff;}
.screen.active{display:flex;}

/* トップ */
#screen-top{align-items:center;justify-content:center;background:#f5f5f0;gap:20px;padding:40px 24px;}
.top-logo{font-size:36px;font-weight:700;letter-spacing:-1px;color:#111;}
.top-desc{font-size:14px;color:#888;text-align:center;line-height:1.6;}
.top-form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;}

/* 名前＋色選択行 */
.name-color-row{display:flex;align-items:center;gap:8px;}
.top-input{flex:1;padding:12px 14px;border-radius:10px;border:0.5px solid #ddd;font-size:15px;background:#fff;color:#111;outline:none;}
.top-input:focus{border-color:#111;}
.color-trigger{width:32px;height:32px;border-radius:50%;flex-shrink:0;position:relative;cursor:pointer;}
.color-trigger-dot{width:32px;height:32px;border-radius:50%;}
.color-chevron{position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;border-radius:50%;background:#fff;border:0.5px solid #ddd;display:flex;align-items:center;justify-content:center;}
.color-chevron i{font-size:9px;color:#888;}
/* 色選択ポップアップ */
.color-popup{display:none;background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:10px 14px;flex-direction:row;gap:10px;align-items:center;justify-content:center;}
.color-popup.open{display:flex;}
.cpick{width:26px;height:26px;border-radius:50%;flex-shrink:0;cursor:pointer;}
.cpick.sel{outline:2.5px solid #333;outline-offset:2px;}

/* 二人の予定行 */
.pair-color-row{display:flex;align-items:center;gap:8px;padding:4px 0;}
.pair-color-label{flex:1;padding:12px 14px;border-radius:10px;border:0.5px solid transparent;font-size:15px;color:#888;}

.top-divider{height:0.5px;background:#ddd;width:100%;max-width:320px;}
.btn-primary{width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;}
.divider{display:flex;align-items:center;gap:10px;color:#bbb;font-size:12px;width:100%;max-width:320px;}
.divider::before,.divider::after{content:'';flex:1;height:0.5px;background:#ddd;}
.btn-secondary{width:100%;max-width:320px;padding:13px;background:#fff;color:#111;border:0.5px solid #ddd;border-radius:12px;font-size:15px;cursor:pointer;}
.join-area{display:none;width:100%;max-width:320px;flex-direction:column;gap:8px;}
.join-area.open{display:flex;}

/* メイン */
#screen-main{position:relative;}
#screen-main.active{position:fixed;inset:0;display:flex;flex-direction:column;}
.main-content{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;}

/* タブバー */
.tab-bar{display:flex;border-top:0.5px solid #eee;background:#fff;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 0 7px;gap:2px;cursor:pointer;}
.tab i{font-size:21px;color:#bbb;}
.tab span{font-size:11px;color:#bbb;}
.tab.active i,.tab.active span{color:#111;}
.tab-content{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0;}
.tab-content.active{display:flex;}

/* 予定タブ */
#tab-schedule{background:#fff;}

/* ヘッダー */
.schedule-header{padding:8px 10px;border-bottom:0.5px solid #eee;display:flex;align-items:center;gap:6px;flex-shrink:0;background:#fff;}
.filter-btns{display:flex;gap:4px;flex:1;}
.f-btn{flex:1;padding:6px 2px;border-radius:20px;font-size:12px;border:0.5px solid #ddd;background:#fff;color:#888;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;min-width:0;}
.f-btn .f-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.f-btn.active{background:#111;color:#fff;border-color:#111;font-weight:500;}
.fbbar{width:3px;height:12px;border-radius:2px;flex-shrink:0;opacity:0.4;}
.f-btn.active .fbbar{opacity:1;}
.view-btns{display:flex;gap:5px;flex-shrink:0;}
.view-btn{width:30px;height:30px;border-radius:8px;border:0.5px solid #ddd;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;}
.view-btn.active{background:#111;border-color:#111;}
.view-btn i{font-size:16px;color:#888;}
.view-btn.active i{color:#fff;}

/* 月ナビ */
.month-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 2px;flex-shrink:0;}
.month-label{font-size:14px;font-weight:500;color:#111;cursor:pointer;}
.nav-arr{font-size:18px;color:#888;padding:4px 10px;cursor:pointer;user-select:none;}

/* リスト */
#view-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;}
.date-hd{font-size:12px;font-weight:500;color:#888;padding:10px 16px 3px;}
.date-hd.today-hd{color:#111;}
.date-hd.holiday-hd,.date-hd.sun-hd{color:#A32D2D;}
.date-hd.sat-hd{color:#185FA5;}
.ecard{margin:4px 12px;padding:10px 12px;border-radius:12px;border:0.5px solid #eee;display:flex;align-items:center;gap:10px;cursor:pointer;}
.ecard:active{background:#f9f9f9;}
.ebar{width:4px;border-radius:2px;align-self:stretch;min-height:36px;flex-shrink:0;}
.ebody{flex:1;min-width:0;}
.etitle{font-size:14px;font-weight:500;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.emeta{font-size:11px;color:#888;margin-top:2px;}
.ewho{font-size:11px;font-weight:500;padding:2px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
.who-both{background:#e1f5ee;color:#085041;}
.who-you{background:#eeedfe;color:#3c3489;}
.who-partner{background:#fbeaf0;color:#72243e;}
.month-divider{font-size:11px;color:#bbb;padding:12px 16px 3px;display:flex;align-items:center;gap:8px;}
.month-divider::after{content:'';flex:1;height:0.5px;background:#eee;}
.empty-msg{text-align:center;color:#bbb;font-size:13px;padding:40px 0;}

/* カレンダー */
#view-calendar{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);padding:4px 10px 0;flex-shrink:0;}
.wd{text-align:center;font-size:11px;color:#bbb;padding:2px 0;}
.wd.sat{color:#185FA5;}.wd.sun{color:#A32D2D;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px;gap:1px;flex-shrink:0;}
.cd{text-align:center;padding:2px 1px;min-height:44px;cursor:pointer;}
.cd .dn{font-size:13px;color:#111;line-height:22px;display:block;}
.cd.sat .dn{color:#185FA5;}.cd.sun .dn,.cd.hol .dn{color:#A32D2D;}
.cd.today .dn{background:#111;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:12px;}
.cd.other .dn{color:#ccc;}
.cd.selected:not(.today){background:#f0f0f0;border-radius:6px;}
.bars{display:flex;flex-direction:column;gap:1px;margin-top:2px;padding:0 2px;}
.bar{height:3px;border-radius:1px;width:100%;}
.cal-detail{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:0.5px solid #eee;min-height:0;}
.cal-detail-hd{font-size:12px;font-weight:500;color:#888;padding:8px 16px 3px;}
.cal-detail-hd.today-hd{color:#111;}
.cal-detail-hd.holiday-hd,.cal-detail-hd.sun-hd{color:#A32D2D;}
.cal-detail-hd.sat-hd{color:#185FA5;}

/* 追加タブ */
#tab-add{background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.add-inner{padding:14px 16px 24px;}
.date-row{display:flex;align-items:center;gap:7px;margin-bottom:13px;}
.date-btn{flex:1;padding:10px 12px;border-radius:8px;border:0.5px solid #ddd;font-size:14px;color:#111;background:#fff;cursor:pointer;text-align:left;}
.rep-btn{padding:9px 12px;border-radius:8px;font-size:13px;border:0.5px solid #ddd;color:#888;background:#fff;white-space:nowrap;cursor:pointer;}
.rep-btn.active{background:#111;color:#fff;border-color:#111;}
.divline{height:0.5px;background:#eee;margin:11px 0;}
.lbl-mini{font-size:11px;color:#888;margin-bottom:5px;}
.tgl-row{display:flex;gap:5px;}
/* 誰の予定トグル：縦棒付き */
.tgl{flex:1;padding:8px 2px;border-radius:20px;font-size:12px;border:0.5px solid #ddd;color:#888;background:#fff;text-align:center;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center;gap:4px;}
.tgl.active{background:#111;color:#fff;border-color:#111;}
.tgl-bar{width:3px;height:14px;border-radius:2px;flex-shrink:0;opacity:0.35;}
.tgl.active .tgl-bar{opacity:1;}
/* 時間帯トグルは棒なし・通常スタイル */
.tgl-plain{flex:1;padding:8px 2px;border-radius:20px;font-size:12px;border:0.5px solid #ddd;color:#888;background:#fff;text-align:center;cursor:pointer;user-select:none;}
.tgl-plain.active{background:#111;color:#fff;border-color:#111;}
.time-specific{margin-top:8px;padding:0 2px;display:flex;align-items:center;gap:10px;}
.time-select{padding:6px 4px;border-radius:8px;border:0.5px solid #ddd;font-size:14px;color:#111;background:#fff;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:center;width:58px;height:36px;}
.time-sep-colon{font-size:14px;color:#888;font-weight:500;}
.text-inp{width:100%;padding:11px 12px;border-radius:8px;border:0.5px solid #ddd;font-size:16px;color:#111;background:#fff;outline:none;resize:none;}
.text-inp:focus{border-color:#aaa;}
.text-inp::placeholder{color:#bbb;}
.save-btn{width:100%;padding:13px;background:#111;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:500;margin-top:14px;cursor:pointer;}
.save-btn:active{background:#333;}
.time-sep{font-size:13px;color:#bbb;}

/* モーダル共通 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;display:none;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal-sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;}
.modal-title{font-size:15px;font-weight:600;color:#111;text-align:center;margin-bottom:12px;}
#modal-date{z-index:200;}

/* 日付選択モーダル */
.cal-modal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cal-modal-month{font-size:14px;font-weight:500;}
.cal-modal-grid-wd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px;}
.cal-modal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:2px;min-height:200px;}
.cal-modal-day{text-align:center;padding:6px 2px;font-size:14px;color:#111;border-radius:8px;cursor:pointer;}
.cal-modal-day:active{background:#f0f0f0;}
.cal-modal-day.sat{color:#185FA5;}
.cal-modal-day.sun,.cal-modal-day.hol{color:#A32D2D;}
.cal-modal-day.today{background:#111;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:13px;}
.cal-modal-day.selected{background:#111;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:13px;}
.cal-modal-day.other{color:#ccc;}
.cal-modal-day.empty{pointer-events:none;}

/* 編集モーダル */
.edit-modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.edit-modal-date{font-size:13px;color:#888;cursor:pointer;text-decoration:underline dotted;}
.edit-modal-close{font-size:22px;color:#bbb;cursor:pointer;line-height:1;}
.edit-section{margin-bottom:10px;}
.edit-label{font-size:11px;color:#888;margin-bottom:4px;}
.edit-text{width:100%;padding:10px 12px;border-radius:8px;border:0.5px solid #ddd;font-size:15px;color:#111;background:#fff;outline:none;resize:none;}
.edit-text:focus{border-color:#aaa;}
.edit-btns{display:flex;gap:8px;margin-top:14px;}
.edit-btn-save{flex:2;padding:12px;background:#111;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;}
.edit-btn-del{flex:1;padding:12px;background:#fff;color:#c0392b;border:1px solid #c0392b;border-radius:12px;font-size:15px;cursor:pointer;}

/* スコープモーダル */
.scope-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.scope-btn{padding:14px 16px;border-radius:12px;border:0.5px solid #ddd;background:#fff;text-align:left;cursor:pointer;font-size:14px;color:#111;}
.scope-btn:active{background:#f5f5f5;}
.scope-btn.danger{color:#c0392b;border-color:#f5c6c6;}
.scope-cancel{width:100%;padding:12px;margin-top:8px;background:#f5f5f5;border:none;border-radius:12px;font-size:14px;color:#888;cursor:pointer;}

/* トースト */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:all 0.2s;pointer-events:none;z-index:200;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- ローディング -->
<div id="screen-loading"><div class="loading-logo">Yote.</div></div>

<!-- トップ画面 -->
<div class="screen active" id="screen-top">
  <div class="top-logo">Yote.</div>
  <p class="top-desc">ふたりの予定をいっしょに管理</p>
  <div class="top-form">
    <!-- 一人目 -->
    <div class="name-color-row">
      <input class="top-input" id="input-person1" type="text" placeholder="一人目の名前" maxlength="8">
      <div class="color-trigger" id="trigger-p1">
        <div class="color-trigger-dot" id="dot-p1" style="background:#5C6BC0;"></div>
        <div class="color-chevron"><i class="ti ti-chevron-down"></i></div>
      </div>
    </div>
    <div class="color-popup" id="popup-p1"></div>
    <!-- 二人目 -->
    <div class="name-color-row">
      <input class="top-input" id="input-person2" type="text" placeholder="二人目の名前" maxlength="8">
      <div class="color-trigger" id="trigger-p2">
        <div class="color-trigger-dot" id="dot-p2" style="background:#EF5350;"></div>
        <div class="color-chevron"><i class="ti ti-chevron-down"></i></div>
      </div>
    </div>
    <div class="color-popup" id="popup-p2"></div>
    <!-- 二人の予定 -->
    <div class="top-divider"></div>
    <div class="name-color-row">
      <div class="pair-color-label">二人の予定</div>
      <div class="color-trigger" id="trigger-both">
        <div class="color-trigger-dot" id="dot-both" style="background:#43A047;"></div>
        <div class="color-chevron"><i class="ti ti-chevron-down"></i></div>
      </div>
    </div>
    <div class="color-popup" id="popup-both"></div>
    <button class="btn-primary" id="btn-create">カレンダーをつくる</button>
  </div>
  <div class="divider">または</div>
  <button class="btn-secondary" id="btn-toggle-join">URLで参加する</button>
  <div class="join-area" id="url-join-area">
    <input class="top-input" id="input-join-url" type="text" placeholder="共有URLを貼り付ける">
    <button class="btn-primary" id="btn-join">参加する</button>
  </div>
</div>

<!-- メイン画面 -->
<div class="screen" id="screen-main">
  <div class="main-content">

    <!-- 予定タブ -->
    <div class="tab-content active" id="tab-schedule">
      <div class="schedule-header">
        <div class="filter-btns">
          <div class="f-btn active" data-who="all"><span class="f-label">全て</span></div>
          <div class="f-btn" data-who="both" id="f-btn-both">
            <div class="fbbar" id="fbar-both" style="background:#43A047;"></div>
            <span class="f-label" id="flabel-both">二人</span>
          </div>
          <div class="f-btn" data-who="you" id="f-btn-you">
            <div class="fbbar" id="fbar-you" style="background:#5C6BC0;"></div>
            <span class="f-label" id="flabel-you">よう</span>
          </div>
          <div class="f-btn" data-who="partner" id="f-btn-partner">
            <div class="fbbar" id="fbar-partner" style="background:#EF5350;"></div>
            <span class="f-label" id="flabel-partner">よしみ</span>
          </div>
        </div>
        <div class="view-btns">
          <div class="view-btn active" id="btn-view-list"><i class="ti ti-list"></i></div>
          <div class="view-btn" id="btn-view-cal"><i class="ti ti-calendar-month"></i></div>
        </div>
      </div>

      <!-- リスト表示 -->
      <div id="view-list" style="display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0;">
        <div class="month-nav" style="flex-shrink:0;">
          <span class="nav-arr" id="list-prev">‹</span>
          <span class="month-label" id="list-month-label">読み込み中...</span>
          <span class="nav-arr" id="list-next">›</span>
        </div>
        <div id="list-body" style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;"></div>
      </div>

      <!-- カレンダー表示 -->
      <div id="view-calendar" style="display:none;flex-direction:column;flex:1;overflow:hidden;min-height:0;">
        <div class="month-nav" style="flex-shrink:0;">
          <span class="nav-arr" id="cal-prev">‹</span>
          <span class="month-label" id="cal-month-label">読み込み中...</span>
          <span class="nav-arr" id="cal-next">›</span>
        </div>
        <div class="cal-wd" style="flex-shrink:0;">
          <div class="wd sun">日</div><div class="wd">月</div><div class="wd">火</div>
          <div class="wd">水</div><div class="wd">木</div><div class="wd">金</div>
          <div class="wd sat">土</div>
        </div>
        <div class="cal-days" id="cal-days" style="flex-shrink:0;"></div>
        <div class="cal-detail" id="cal-detail"></div>
      </div>
    </div>

    <!-- 追加タブ -->
    <div class="tab-content" id="tab-add">
      <div class="add-inner">
        <div class="date-row">
          <div class="date-btn" id="add-date-btn"></div>
          <div class="rep-btn" id="rep-weekly">毎週</div>
          <div class="rep-btn" id="rep-monthly">毎月</div>
        </div>
        <div class="lbl-mini">時間帯</div>
        <div class="tgl-row" id="tgl-timeslot">
          <div class="tgl-plain active" data-val="unset">未定</div>
          <div class="tgl-plain" data-val="allday">終日</div>
          <div class="tgl-plain" data-val="morning">午前</div>
          <div class="tgl-plain" data-val="afternoon">午後</div>
          <div class="tgl-plain" data-val="specific">時間</div>
        </div>
        <div id="time-specific-row" style="display:none;">
          <div class="time-specific">
            <div class="date-btn time-date-btn" id="add-date-start-btn" style="flex-shrink:0;width:auto;padding:6px 10px;font-size:13px;"></div>
            <select class="time-select" id="sel-start-h"></select>
            <span class="time-sep-colon">:</span>
            <select class="time-select" id="sel-start-m"></select>
            <span class="time-sep">から</span>
          </div>
          <div class="time-specific" style="margin-top:6px;">
            <div class="date-btn time-date-btn" id="add-date-end-btn" style="flex-shrink:0;width:auto;padding:6px 10px;font-size:13px;"></div>
            <select class="time-select" id="sel-end-h"></select>
            <span class="time-sep-colon">:</span>
            <select class="time-select" id="sel-end-m"></select>
            <span class="time-sep">まで</span>
          </div>
        </div>
        <div class="divline"></div>
        <input class="text-inp" id="add-title" type="text" placeholder="何の予定？">
        <div class="divline"></div>
        <div class="lbl-mini">誰の予定</div>
        <div class="tgl-row" id="tgl-who">
          <div class="tgl active" data-val="both">
            <div class="tgl-bar" id="who-bar-both" style="background:#43A047;"></div>
            <span id="who-label-both">二人</span>
          </div>
          <div class="tgl" data-val="you">
            <div class="tgl-bar" id="who-bar-you" style="background:#5C6BC0;"></div>
            <span id="who-label-you">よう</span>
          </div>
          <div class="tgl" data-val="partner">
            <div class="tgl-bar" id="who-bar-partner" style="background:#EF5350;"></div>
            <span id="who-label-partner">よしみ</span>
          </div>
        </div>

function timeSlotLabel(ev,role){
  if(role==='mid')return '終日';
  if(ev.timeSlot==='allday')return '終日';
  if(ev.timeSlot==='morning')return '午前';
  if(ev.timeSlot==='afternoon')return '午後';
  if(ev.timeSlot==='specific'){
    if(role==='last')return ev.endTime?`〜 ${ev.endTime}`:'終日';
    if(role==='first')return ev.startTime?`${ev.startTime} 〜`:'終日';
    if(ev.startTime&&ev.endTime)return `${ev.startTime} 〜 ${ev.endTime}`;
    if(ev.startTime)return `${ev.startTime} 〜`;
    if(ev.endTime)return `〜 ${ev.endTime}`;
    return '時間未定';
  }
  return '時間未定';
}

function getFilteredEvents(){
  const all=Object.entries(state.events).map(([id,e])=>({...e,_id:id}));
  if(state.filter==='all')return all;
  return all.filter(e=>e.who===state.filter);
}

// ===== リスト描画 =====
function expandEvents(events){
  const expanded=[];
  events.forEach(ev=>{
    if(!ev.dateEnd||ev.dateEnd<=ev.date){expanded.push({...ev,_role:undefined});return;}
    let cur=ev.date;
    while(cur<=ev.dateEnd){
      const role=cur===ev.date?'first':cur===ev.dateEnd?'last':'mid';
      expanded.push({...ev,date:cur,_role:role});
      cur=addDays(cur,1);
    }
  });
  return expanded;
}

function renderList(){
  const[y,m]=state.listMonth.split('-').map(Number);
  document.getElementById('list-month-label').textContent=`${y}年${m}月`;
  const today=todayStr();
  const monthStart=`${String(y)}-${String(m).padStart(2,'0')}-01`;
  const monthEnd=`${String(y)}-${String(m).padStart(2,'0')}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`;
  const events=expandEvents(getFilteredEvents())
    .filter(e=>e.date>=monthStart&&e.date<=monthEnd)
    .sort((a,b)=>{
      const dateCmp=a.date.localeCompare(b.date);
      if(dateCmp!==0)return dateCmp;
      const slotMin=ev=>{
        if(ev.timeSlot==='allday')return -1;
        if(ev.timeSlot==='morning')return 719;
        if(ev.timeSlot==='afternoon')return 1439;
        if(ev.timeSlot==='specific'&&ev.startTime){
          const[h,m]=ev.startTime.split(':').map(Number);return h*60+m;
        }
        return 99999;
      };
      const startCmp=slotMin(a)-slotMin(b);
      if(startCmp!==0)return startCmp;
      const toMin=t=>t?(parseInt(t.split(':')[0])*60+parseInt(t.split(':')[1])):99999;
      const endCmp=toMin(a.endTime)-toMin(b.endTime);
      if(endCmp!==0)return endCmp;
      return a.createdAt-b.createdAt;
    });
  if(events.length===0){
    document.getElementById('list-body').innerHTML='<div class="empty-msg">予定はありません</div>';
    return;
  }
  let html='';let lastDate='';
  events.forEach(ev=>{
    if(ev.date!==lastDate){
      lastDate=ev.date;
      const d=parseDateStr(ev.date);const dow=d.getDay();const hol=isHoliday(d);const isToday=ev.date===today;
      let cls='date-hd';
      if(isToday)cls+=' today-hd';else if(hol)cls+=' holiday-hd';else if(dow===0)cls+=' sun-hd';else if(dow===6)cls+=' sat-hd';
      const holTxt=hol?'・祝':'';
      html+=`<div class="${cls}" data-date="${ev.date}">${isToday?'今日 ':''}${d.getMonth()+1}/${d.getDate()}（${DOW_JA[dow]}${holTxt}）</div>`;
    }
    const w=whoLabel(ev.who);const clr=colorOf(ev.who);
    html+=`<div class="ecard" data-id="${ev._id}">
      <div class="ebar" style="background:${clr};"></div>
      <div class="ebody"><div class="etitle">${ev.title||''}</div><div class="emeta">${timeSlotLabel(ev,ev._role)}</div></div>
      <span class="ewho ${w.cls}">${w.label}</span>
    </div>`;
  });
  document.getElementById('list-body').innerHTML=html+'<div style="height:60vh;"></div>';
  // 当月なら今日にスクロール、それ以外は先頭
  const nowYM=`${_now.getFullYear()}-${String(_now.getMonth()+1).padStart(2,'0')}`;
  if(state.listMonth===nowYM){
    // 今日以降で最初の予定カードか日付ヘッダーを探す
    const allHds=document.querySelectorAll('#list-body [data-date]');
    let scrollTarget=null;
    allHds.forEach(el=>{if(!scrollTarget&&el.dataset.date>=today)scrollTarget=el;});
    if(scrollTarget)scrollTarget.scrollIntoView({block:'start'});
    else document.getElementById('list-body').scrollTop=0;
  } else {
    document.getElementById('list-body').scrollTop=0;
  }
}


// ===== カレンダー描画 =====
function renderCalendar(){
  const[y,m]=state.calMonth.split('-').map(Number);
  document.getElementById('cal-month-label').textContent=`${y}年${m}月`;
  const first=new Date(y,m-1,1),last=new Date(y,m,0);
  const evByDate={};
  getFilteredEvents().forEach(ev=>{if(!evByDate[ev.date])evByDate[ev.date]=[];evByDate[ev.date].push(ev);});
  let html='';
  for(let i=0;i<first.getDay();i++)html+=`<div class="cd other"><span class="dn"></span></div>`;
  for(let d=1;d<=last.getDate();d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dt=new Date(y,m-1,d);const dow=dt.getDay();const hol=isHoliday(dt);
    const isToday=ds===todayStr();const isSel=ds===state.calSelectedDate;
    let cls='cd';
    if(isToday)cls+=' today';else if(isSel)cls+=' selected';
    if(hol||dow===0)cls+=' sun hol';else if(dow===6)cls+=' sat';
    const bars=(evByDate[ds]||[]).slice(0,3).map(ev=>`<div class="bar" style="background:${colorOf(ev.who)};"></div>`).join('');
    html+=`<div class="${cls}" data-date="${ds}"><span class="dn">${d}</span>${bars?`<div class="bars">${bars}</div>`:''}</div>`;
  }
  document.getElementById('cal-days').innerHTML=html;
  renderCalDetail(state.calSelectedDate);
}
function renderCalDetail(dateStr){
  const detail=document.getElementById('cal-detail');
  if(!dateStr){detail.innerHTML='';return;}
  const d=parseDateStr(dateStr);const dow=d.getDay();const hol=isHoliday(d);
  let cls='cal-detail-hd';
  if(dateStr===todayStr())cls+=' today-hd';else if(hol||dow===0)cls+=' holiday-hd';else if(dow===6)cls+=' sat-hd';
  const evs=getFilteredEvents().filter(e=>e.date===dateStr);
  let html=`<div class="${cls}">${d.getMonth()+1}/${d.getDate()}（${DOW_JA[dow]}${hol?'・祝':''}）の予定</div>`;
  if(!evs.length)html+=`<div class="empty-msg" style="padding:16px 0;">予定はありません</div>`;
  else evs.forEach(ev=>{
    const w=whoLabel(ev.who);const clr=colorOf(ev.who);
    html+=`<div class="ecard" data-id="${ev._id}">
      <div class="ebar" style="background:${clr};"></div>
      <div class="ebody"><div class="etitle">${ev.title||''}</div><div class="emeta">${timeSlotLabel(ev)}</div></div>
      <span class="ewho ${w.cls}">${w.label}</span>
    </div>`;
  });
  detail.innerHTML=html;
}

    if(hol||dow===0)cls+=' sun hol';else if(dow===6)cls+=' sat';

// 6行固定になるよう空セルを追加
  const totalCells=first.getDay()+last.getDate();

async function doSaveEdit(scope){
  const id=state.editId;const ev=state.events[id];
  const newData={...state.editData};delete newData._id;
  try{
    if(scope==='this'||!ev.repeatGroupId){await update(ref(db,`rooms/${state.roomId}/events/${id}`),newData);}
    else{
      const groupId=ev.repeatGroupId;const baseDate=ev.date;const updates={};
      Object.entries(state.events).forEach(([eid,e])=>{if(e.repeatGroupId===groupId&&e.date>=baseDate)updates[`rooms/${state.roomId}/events/${eid}`]={...newData,date:e.date,repeatGroupId:groupId,repeat:e.repeat};});
      await update(ref(db),updates);
    }
    showToast('保存しました ✓');
  }catch(e){showToast('保存に失敗しました');}
}
async function doDelete(scope){
  const id=state.editId;const ev=state.events[id];
  try{
    if(scope==='this'||!ev.repeatGroupId){await remove(ref(db,`rooms/${state.roomId}/events/${id}`));}
    else{
      const groupId=ev.repeatGroupId;const baseDate=ev.date;
      const deletes=Object.entries(state.events).filter(([,e])=>e.repeatGroupId===groupId&&e.date>=baseDate).map(([eid])=>remove(ref(db,`rooms/${state.roomId}/events/${eid}`)));
      await Promise.all(deletes);
    }
    showToast('削除しました');
  }catch(e){showToast('削除に失敗しました');}
}

document.getElementById('btn-save').addEventListener('click',async()=>{
  const title=document.getElementById('add-title').value.trim();
  if(!title){showToast('タイトルを入力してください');return;}
  const sh=document.getElementById('sel-start-h').value,sm=document.getElementById('sel-start-m').value||'00';
  const eh=document.getElementById('sel-end-h').value,em=document.getElementById('sel-end-m').value||'00';
  const base={title,who:state.add.who,timeSlot:state.add.timeSlot,repeat:state.add.repeat,memo:document.getElementById('add-memo').value.trim(),createdAt:Date.now()};
  if(state.add.timeSlot==='specific'){if(sh&&sm)base.startTime=`${sh}:${sm}`;if(eh&&em)base.endTime=`${eh}:${em}`;}
  if(state.add.dateEnd&&state.add.dateEnd>state.add.date)base.dateEnd=state.add.dateEnd;
  try{
    if(state.add.repeat==='none'){await push(ref(db,`rooms/${state.roomId}/events`),{...base,date:state.add.date});}
    else{
      const groupId=Math.random().toString(36).slice(2,14);const tasks=[];let cur=state.add.date;const limit=addMonths(state.add.date,12);
      while(cur<=limit){tasks.push(push(ref(db,`rooms/${state.roomId}/events`),{...base,date:cur,repeatGroupId:groupId}));cur=state.add.repeat==='weekly'?addDays(cur,7):addMonths(cur,1);}
      await Promise.all(tasks);
    }
    showToast('保存しました ✓');
    // タイトル・メモのみリセット。日付・時間帯・誰・繰り返しは維持
    document.getElementById('add-title').value='';
    document.getElementById('add-memo').value='';
    // 予定タブに遷移して保存した日付を表示
    const savedDate=state.add.date;
    const savedYM=savedDate.slice(0,7);
    state.listMonth=savedYM;
    state.calMonth=savedYM;
    state.calSelectedDate=savedDate;
    showTab('schedule');
    if(state.view==='list'){
      document.getElementById('view-list').style.display='flex';
      document.getElementById('view-calendar').style.display='none';
    } else {
      document.getElementById('view-list').style.display='none';
      document.getElementById('view-calendar').style.display='flex';
      renderCalendar();
    }
  }catch(e){showToast('保存に失敗しました');}
});

// ===== トップ画面：色選択 =====
function buildColorPopup(popupEl,current,onChange){
  popupEl.innerHTML='';
  COLOR_OPTIONS.forEach(c=>{
    const d=document.createElement('div');
    d.className='cpick'+(c===current?' sel':'');
    d.style.background=c;
    d.addEventListener('click',()=>{
      popupEl.querySelectorAll('.cpick').forEach(x=>x.classList.remove('sel'));
      d.classList.add('sel');
      onChange(c);
      popupEl.classList.remove('open');
    });
    popupEl.appendChild(d);
  });
}
function initColorPickers(){
  const configs=[
    {triggerId:'trigger-p1',dotId:'dot-p1',popupId:'popup-p1',key:'p1'},
    {triggerId:'trigger-p2',dotId:'dot-p2',popupId:'popup-p2',key:'p2'},
    {triggerId:'trigger-both',dotId:'dot-both',popupId:'popup-both',key:'both'},
  ];
  configs.forEach(({triggerId,dotId,popupId,key})=>{
    const trigger=document.getElementById(triggerId);
    const dot=document.getElementById(dotId);
    const popup=document.getElementById(popupId);
    buildColorPopup(popup,state.topColors[key],(color)=>{
      state.topColors[key]=color;
      dot.style.background=color;
      buildColorPopup(popup,color,(c2)=>{state.topColors[key]=c2;dot.style.background=c2;});
    });
    trigger.addEventListener('click',()=>{
      // 他を閉じる
      configs.forEach(cfg=>{if(cfg.popupId!==popupId)document.getElementById(cfg.popupId).classList.remove('open');});
      popup.classList.toggle('open');
    });
  });
  // ポップアップ外タップで閉じる
  document.addEventListener('click',e=>{
    configs.forEach(({triggerId,popupId})=>{
      if(!document.getElementById(triggerId).contains(e.target))document.getElementById(popupId).classList.remove('open');
    });
  },{capture:true});
}
initColorPickers();

// ===== Firebase購読 =====
function subscribeRoom(roomId){
  onValue(ref(db,`rooms/${roomId}/events`),snap=>{
    state.events=snap.val()||{};
    if(state.view==='list')renderList();else renderCalendar();
  });
  onValue(ref(db,`rooms/${roomId}/meta`),snap=>{
    if(!snap.exists())return;
    state.meta=snap.val();updateNameBtns();
    if(state.view==='list')renderList();else renderCalendar();
  });
}

// ===== 起動 =====
function hideLoading(){const l=document.getElementById('screen-loading');l.classList.add('hide');setTimeout(()=>l.style.display='none',250);}
async function init(){
  document.getElementById('add-date-btn').textContent=formatDateLabel(state.add.date);
  const hash=location.hash.replace('#','');
  if(hash&&/^[a-z0-9]{12}$/.test(hash)){
    try{
      const snap=await get(ref(db,`rooms/${hash}/meta`));
      if(snap.exists()){
        state.roomId=hash;state.meta=snap.val();
        localStorage.setItem('yote_room',hash);
        updateNameBtns();subscribeRoom(hash);showScreen('screen-main');hideLoading();return;
      }
    }catch(e){console.error(e);}
  }
  const saved=localStorage.getItem('yote_room');
  if(saved){
    try{
      const snap=await get(ref(db,`rooms/${saved}/meta`));
      if(snap.exists()){
        state.roomId=saved;state.meta=snap.val();
        location.hash=saved;updateNameBtns();subscribeRoom(saved);showScreen('screen-main');hideLoading();return;
      }
    }catch(e){console.error(e);}
  }
  hideLoading();showScreen('screen-top');
}
init();
