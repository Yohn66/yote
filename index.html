<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yote.</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#f5f5f0;color:#111;}

/* ===== スクリーン管理 ===== */
.screen{display:none;flex-direction:column;height:100vh;height:100dvh;background:#fff;}
.screen.active{display:flex;}

/* ===== トップ画面 ===== */
#screen-top{align-items:center;justify-content:center;background:#f5f5f0;gap:24px;padding:40px 24px;}
.top-logo{font-size:36px;font-weight:700;letter-spacing:-1px;color:#111;}
.top-logo span{color:#888;font-weight:400;}
.top-desc{font-size:14px;color:#888;text-align:center;line-height:1.6;}
.top-form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;}
.top-input{width:100%;padding:12px 14px;border-radius:10px;border:0.5px solid #ddd;font-size:15px;background:#fff;color:#111;outline:none;}
.top-input:focus{border-color:#111;}
.btn-primary{width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;}
.divider{display:flex;align-items:center;gap:10px;color:#bbb;font-size:12px;width:100%;max-width:320px;}
.divider::before,.divider::after{content:'';flex:1;height:0.5px;background:#ddd;}
.btn-secondary{width:100%;max-width:320px;padding:13px;background:#fff;color:#111;border:0.5px solid #ddd;border-radius:12px;font-size:15px;cursor:pointer;}
.join-area{display:none;width:100%;max-width:320px;flex-direction:column;gap:8px;}
.join-area.open{display:flex;}
.join-area .top-input{margin:0;}

/* ===== メイン画面（予定・追加タブ） ===== */
#screen-main{position:relative;}
.main-content{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* タブバー */
.tab-bar{display:flex;border-top:0.5px solid #eee;background:#fff;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 0 7px;gap:2px;cursor:pointer;}
.tab i{font-size:21px;color:#bbb;}
.tab span{font-size:11px;color:#bbb;}
.tab.active i,.tab.active span{color:#111;}

/* タブコンテンツ */
.tab-content{display:none;flex:1;flex-direction:column;overflow:hidden;}
.tab-content.active{display:flex;}

/* ===== 予定タブ ===== */
#tab-schedule{background:#fff;}

/* ヘッダー */
.schedule-header{padding:10px 14px;border-bottom:0.5px solid #eee;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.filter-btns{display:flex;gap:5px;flex:1;}
.f-btn{flex:1;padding:6px 0;border-radius:20px;font-size:13px;border:0.5px solid #ddd;background:#fff;color:#888;text-align:center;cursor:pointer;}
.f-btn.active{background:#111;color:#fff;border-color:#111;font-weight:500;}
.view-btns{display:flex;gap:5px;flex-shrink:0;}
.view-btn{width:30px;height:30px;border-radius:8px;border:0.5px solid #ddd;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;}
.view-btn.active{background:#111;border-color:#111;}
.view-btn i{font-size:16px;color:#888;}
.view-btn.active i{color:#fff;}

/* 月ナビ */
.month-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 2px;flex-shrink:0;}
.month-label{font-size:14px;font-weight:500;color:#111;}
.nav-arr{font-size:18px;color:#888;padding:4px 10px;cursor:pointer;user-select:none;}

/* リスト表示 */
#view-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.date-hd{font-size:12px;font-weight:500;color:#888;padding:10px 16px 3px;}
.date-hd.today-hd{color:#111;}
.date-hd.holiday-hd{color:#A32D2D;}
.date-hd.sun-hd{color:#A32D2D;}
.date-hd.sat-hd{color:#185FA5;}
.ecard{margin:4px 12px;padding:10px 12px;border-radius:12px;border:0.5px solid #eee;display:flex;align-items:center;gap:10px;cursor:pointer;}
.ecard:active{background:#f9f9f9;}
.ebar{width:4px;border-radius:2px;align-self:stretch;min-height:36px;flex-shrink:0;}
.ebody{flex:1;min-width:0;}
.etitle{font-size:14px;font-weight:500;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.emeta{font-size:11px;color:#888;margin-top:2px;}
.ewho{font-size:11px;font-weight:500;padding:2px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
.who-both{background:#eeedfe;color:#3c3489;}
.who-you{background:#e1f5ee;color:#085041;}
.who-partner{background:#fbeaf0;color:#72243e;}
.month-divider{font-size:11px;color:#bbb;padding:10px 16px 3px;display:flex;align-items:center;gap:8px;}
.month-divider::after{content:'';flex:1;height:0.5px;background:#eee;}
.empty-msg{text-align:center;color:#bbb;font-size:13px;padding:40px 0;}

/* カレンダー表示 */
#view-calendar{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);padding:4px 10px 0;flex-shrink:0;}
.wd{text-align:center;font-size:11px;color:#bbb;padding:2px 0;}
.wd.sat{color:#185FA5;}.wd.sun{color:#A32D2D;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px;gap:1px;flex-shrink:0;}
.cd{text-align:center;padding:2px 1px;min-height:44px;cursor:pointer;}
.cd .dn{font-size:13px;color:#111;line-height:22px;display:block;}
.cd.sat .dn{color:#185FA5;}.cd.sun .dn,.cd.hol .dn{color:#A32D2D;}
.cd.today .dn{background:#111;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:12px;}
.cd.other .dn{color:#ccc;}
.cd.selected{background:#f5f5f0;border-radius:6px;}
.bars{display:flex;flex-direction:column;gap:1px;margin-top:2px;padding:0 2px;}
.bar{height:3px;border-radius:1px;width:100%;}
.cal-detail{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:0.5px solid #eee;}
.cal-detail-hd{font-size:12px;font-weight:500;color:#888;padding:8px 16px 3px;}

/* ===== 追加タブ ===== */
#tab-add{background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.add-inner{padding:14px 16px 24px;}

/* 日付行 */
.date-row{display:flex;align-items:center;gap:7px;margin-bottom:13px;}
.date-btn{flex:1;padding:10px 12px;border-radius:8px;border:0.5px solid #ddd;font-size:14px;color:#111;background:#fff;cursor:pointer;text-align:left;}
.rep-btn{padding:9px 12px;border-radius:8px;font-size:13px;border:0.5px solid #ddd;color:#888;background:#fff;white-space:nowrap;cursor:pointer;}
.rep-btn.active{background:#111;color:#fff;border-color:#111;}

/* 区切り線・ラベル */
.divline{height:0.5px;background:#eee;margin:11px 0;}
.lbl-mini{font-size:11px;color:#888;margin-bottom:5px;}

/* トグルボタン群 */
.tgl-row{display:flex;gap:5px;}
.tgl{flex:1;padding:8px 0;border-radius:20px;font-size:12px;border:0.5px solid #ddd;color:#888;background:#fff;text-align:center;cursor:pointer;user-select:none;}
.tgl.active{background:#111;color:#fff;border-color:#111;}

/* 時間指定展開エリア */
.time-specific{margin-top:8px;padding:0 2px;display:flex;align-items:center;gap:10px;}
.time-select{padding:6px 8px;border-radius:8px;border:0.5px solid #ddd;font-size:14px;color:#111;background:#fff;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:center;}
.time-select.ph{color:#bbb;}
.time-sep{font-size:13px;color:#bbb;}

/* テキスト入力 */
.text-inp{width:100%;padding:11px 12px;border-radius:8px;border:0.5px solid #ddd;font-size:15px;color:#111;background:#fff;outline:none;resize:none;}
.text-inp:focus{border-color:#aaa;}
.text-inp::placeholder{color:#bbb;}

/* 色選択 */
.color-row{display:flex;gap:8px;}
.cdot{flex:1;height:16px;border-radius:6px;cursor:pointer;transition:outline 0.1s;}
.cdot.sel{outline:2.5px solid #555;outline-offset:2px;}

/* 保存ボタン */
.save-btn{width:100%;padding:13px;background:#111;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:500;margin-top:14px;cursor:pointer;}
.save-btn:active{background:#333;}

/* ===== カレンダーモーダル（日付選択） ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;display:none;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal-sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;}
.modal-title{font-size:15px;font-weight:600;color:#111;text-align:center;margin-bottom:12px;}
.cal-modal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cal-modal-month{font-size:14px;font-weight:500;}
.cal-modal-grid-wd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px;}
.cal-modal-grid-wd .wd{font-size:11px;color:#bbb;text-align:center;padding:2px 0;}
.cal-modal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-modal-day{text-align:center;padding:6px 2px;font-size:14px;color:#111;border-radius:8px;cursor:pointer;}
.cal-modal-day:active{background:#f0f0f0;}
.cal-modal-day.sat{color:#185FA5;}
.cal-modal-day.sun,.cal-modal-day.hol{color:#A32D2D;}
.cal-modal-day.today{background:#111;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:13px;}
.cal-modal-day.selected{background:#111;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:13px;}
.cal-modal-day.other{color:#ccc;}
.cal-modal-day.empty{pointer-events:none;}

/* ===== トースト ===== */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:all 0.2s;pointer-events:none;z-index:200;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== カラー定義 ===== */
.c-green{background:#43A047;}
.c-red{background:#EF5350;}
.c-yellow{background:#F9A825;}
.c-indigo{background:#5C6BC0;}
</style>
</head>
<body>

<!-- ===== トップ画面 ===== -->
<div class="screen active" id="screen-top">
  <div class="top-logo">Yote.<span></span></div>
  <p class="top-desc">ふたりの予定をいっしょに管理</p>
  <div class="top-form">
    <input class="top-input" id="input-person1" type="text" placeholder="一人目の名前（例：よう）" maxlength="8">
    <input class="top-input" id="input-person2" type="text" placeholder="二人目の名前（例：よしみ）" maxlength="8">
    <button class="btn-primary" id="btn-create">カレンダーをつくる</button>
  </div>
  <div class="divider">または</div>
  <button class="btn-secondary" id="btn-toggle-join">URLで参加する</button>
  <div class="join-area" id="url-join-area">
    <input class="top-input" id="input-join-url" type="text" placeholder="共有URLを貼り付ける">
    <button class="btn-primary" id="btn-join">参加する</button>
  </div>
</div>

<!-- ===== メイン画面 ===== -->
<div class="screen" id="screen-main">
  <div class="main-content">

    <!-- 予定タブ -->
    <div class="tab-content active" id="tab-schedule">
      <div class="schedule-header">
        <div class="filter-btns">
          <div class="f-btn active" data-who="both">二人</div>
          <div class="f-btn" data-who="you" id="f-btn-you">よう</div>
          <div class="f-btn" data-who="partner" id="f-btn-partner">よしみ</div>
        </div>
        <div class="view-btns">
          <div class="view-btn active" id="btn-view-list"><i class="ti ti-list"></i></div>
          <div class="view-btn" id="btn-view-cal"><i class="ti ti-calendar-month"></i></div>
        </div>
      </div>

      <!-- リスト表示 -->
      <div id="view-list">
        <div class="month-nav">
          <span class="nav-arr" id="list-prev">‹</span>
          <span class="month-label" id="list-month-label">2026年5月</span>
          <span class="nav-arr" id="list-next">›</span>
        </div>
        <div id="list-body"></div>
      </div>

      <!-- カレンダー表示 -->
      <div id="view-calendar" style="display:none;flex-direction:column;">
        <div class="month-nav">
          <span class="nav-arr" id="cal-prev">‹</span>
          <span class="month-label" id="cal-month-label">2026年5月</span>
          <span class="nav-arr" id="cal-next">›</span>
        </div>
        <div class="cal-wd">
          <div class="wd sun">日</div><div class="wd">月</div><div class="wd">火</div>
          <div class="wd">水</div><div class="wd">木</div><div class="wd">金</div>
          <div class="wd sat">土</div>
        </div>
        <div class="cal-days" id="cal-days"></div>
        <div class="cal-detail" id="cal-detail"></div>
      </div>
    </div>

    <!-- 追加タブ -->
    <div class="tab-content" id="tab-add">
      <div class="add-inner">
        <!-- 日付 + 繰り返し -->
        <div class="date-row">
          <div class="date-btn" id="add-date-btn">2026年5月21日（木）</div>
          <div class="rep-btn" id="rep-weekly">毎週</div>
          <div class="rep-btn" id="rep-monthly">毎月</div>
        </div>

        <!-- 時間帯 -->
        <div class="lbl-mini">時間帯</div>
        <div class="tgl-row" id="tgl-timeslot">
          <div class="tgl active" data-val="unset">未定</div>
          <div class="tgl" data-val="allday">終日</div>
          <div class="tgl" data-val="morning">午前</div>
          <div class="tgl" data-val="afternoon">午後</div>
          <div class="tgl" data-val="specific">時間指定</div>
        </div>
        <!-- 時間指定展開 -->
        <div class="time-specific" id="time-specific-row" style="display:none;">
          <select class="time-select" id="sel-start"><option value="" disabled selected>開始</option></select>
          <span class="time-sep">から</span>
          <select class="time-select" id="sel-end"><option value="">未定</option></select>
          <span class="time-sep">まで</span>
        </div>

        <div class="divline"></div>

        <!-- タイトル -->
        <input class="text-inp" id="add-title" type="text" placeholder="何の予定？">

        <div class="divline"></div>

        <!-- 誰の予定 -->
        <div class="lbl-mini">誰の予定</div>
        <div class="tgl-row" id="tgl-who">
          <div class="tgl active" data-val="both">二人</div>
          <div class="tgl" data-val="you" id="who-you-btn">よう</div>
          <div class="tgl" data-val="partner" id="who-partner-btn">よしみ</div>
        </div>

        <div class="divline"></div>

        <!-- 色 -->
        <div class="lbl-mini">色</div>
        <div class="color-row" id="color-row">
          <div class="cdot c-green sel" data-color="#43A047"></div>
          <div class="cdot c-red" data-color="#EF5350"></div>
          <div class="cdot c-yellow" data-color="#F9A825"></div>
          <div class="cdot c-indigo" data-color="#5C6BC0"></div>
        </div>

        <div class="divline"></div>

        <!-- メモ -->
        <div class="lbl-mini">メモ（任意）</div>
        <textarea class="text-inp" id="add-memo" rows="2" placeholder="メモ"></textarea>

        <button class="save-btn" id="btn-save">保存する</button>
      </div>
    </div>

  </div>

  <!-- タブバー -->
  <div class="tab-bar" id="tab-bar">
    <div class="tab active" data-tab="schedule">
      <i class="ti ti-calendar"></i>
      <span>予定</span>
    </div>
    <div class="tab" data-tab="add">
      <i class="ti ti-plus"></i>
      <span>追加</span>
    </div>
  </div>
</div>

<!-- ===== 日付選択モーダル ===== -->
<div class="modal-overlay" id="modal-date">
  <div class="modal-sheet">
    <div class="modal-title">日付を選択</div>
    <div class="cal-modal-nav">
      <span class="nav-arr" id="modal-cal-prev">‹</span>
      <span class="cal-modal-month" id="modal-cal-month"></span>
      <span class="nav-arr" id="modal-cal-next">›</span>
    </div>
    <div class="cal-modal-grid-wd">
      <div class="wd sun">日</div><div class="wd">月</div><div class="wd">火</div>
      <div class="wd">水</div><div class="wd">木</div><div class="wd">金</div>
      <div class="wd sat">土</div>
    </div>
    <div class="cal-modal-grid" id="modal-cal-grid"></div>
  </div>
</div>

<!-- ===== トースト ===== -->
<div class="toast" id="toast"></div>

<script type="module">

function toDateStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseDateStr(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function todayStr(){ return toDateStr(new Date()); }
function generateRoomId(){ return Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,8); }
function getRoomUrl(id){ return `${location.origin}${location.pathname}#${id}`; }
function formatDateLabel(dateStr){
  const d=parseDateStr(dateStr);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${DOW_JA[d.getDay()]}）`;

// ===== 状態 =====

  add: {

    timeSlot: "unset",
    startTime: "",
    endTime: "",
    title: "",
    who: "both",
    color: "#43A047",
    memo: "",
    repeat: "none"
  }
};

// 今月を初期値に
const _now = new Date();
state.listMonth = `${_now.getFullYear()}-${String(_now.getMonth()+1).padStart(2,'0')}`;
state.calMonth = state.listMonth;
state.calSelectedDate = todayStr();

// ===== ユーティリティ =====
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function showTab(name){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.getElementById(`tab-${name}`).classList.add('active');
}
let toastTimer;
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

function timeSlotLabel(ev){
  if(ev.timeSlot==='allday') return '終日';
  if(ev.timeSlot==='morning') return '午前';
  if(ev.timeSlot==='afternoon') return '午後';
  if(ev.timeSlot==='specific'){
    if(ev.startTime && ev.endTime) return `${ev.startTime} 〜 ${ev.endTime}`;
    if(ev.startTime) return `${ev.startTime} 〜`;
    return '時間指定';
  }
  return '時間未定';
}

function whoLabel(who){
  if(who==='both') return {label:state.meta.person1&&state.meta.person2?'二人':'二人', cls:'who-both'};
  if(who==='you')  return {label:state.meta.person1||'よう', cls:'who-you'};
  return {label:state.meta.person2||'よしみ', cls:'who-partner'};
}

// ===== 名前ボタン更新 =====
function updateNameBtns(){
  const p1=state.meta.person1||'よう';
  const p2=state.meta.person2||'よしみ';
  document.getElementById('f-btn-you').textContent=p1;
  document.getElementById('f-btn-partner').textContent=p2;
  document.getElementById('who-you-btn').textContent=p1;
  document.getElementById('who-partner-btn').textContent=p2;
}

// ===== リスト描画 =====
function getFilteredEvents(){
  const all = Object.values(state.events);
  if(state.filter==='both') return all;
  return all.filter(e=>e.who===state.filter);
}

function renderList(){
  const [y,m] = state.listMonth.split('-').map(Number);
  document.getElementById('list-month-label').textContent=`${y}年${m}月`;

  const events = getFilteredEvents()
    .filter(e=>{ const d=parseDateStr(e.date); return d.getFullYear()===y&&d.getMonth()+1===m; })
    .sort((a,b)=>a.date.localeCompare(b.date));

  const body = document.getElementById('list-body');
  if(events.length===0){ body.innerHTML=`<div class="empty-msg">予定はありません</div>`; return; }

  let html=''; let lastDate='';
  for(const ev of events){
    if(ev.date!==lastDate){
      lastDate=ev.date;
      const d=parseDateStr(ev.date);
      const dow=d.getDay();
      const hol=isHoliday(d);
      const isToday=ev.date===todayStr();
      let cls='date-hd';
      if(isToday) cls+=' today-hd';
      else if(hol) cls+=' holiday-hd';
      else if(dow===0) cls+=' sun-hd';
      else if(dow===6) cls+=' sat-hd';
      const holTxt=hol?'・祝':'';
      html+=`<div class="${cls}">${isToday?'今日 ':''}${m}/${d.getDate()}（${DOW_JA[dow]}${holTxt}）</div>`;
    }
    const w=whoLabel(ev.who);
    html+=`<div class="ecard">
      <div class="ebar" style="background:${ev.color||'#43A047'};"></div>
      <div class="ebody">
        <div class="etitle">${ev.title}</div>
        <div class="emeta">${timeSlotLabel(ev)}</div>
      </div>
      <span class="ewho ${w.cls}">${w.label}</span>
    </div>`;
  }
  body.innerHTML=html;
}

// ===== カレンダー描画 =====
function renderCalendar(){
  const [y,m] = state.calMonth.split('-').map(Number);
  document.getElementById('cal-month-label').textContent=`${y}年${m}月`;

  const first=new Date(y,m-1,1);
  const last=new Date(y,m,0);
  const startDow=first.getDay();

  const events=getFilteredEvents();
  const evByDate={};
  events.forEach(ev=>{
    if(!evByDate[ev.date]) evByDate[ev.date]=[];
    evByDate[ev.date].push(ev);
  });

  let html='';
  // 前月の空白
  for(let i=0;i<startDow;i++) html+=`<div class="cd other"><span class="dn"></span></div>`;

  for(let d=1;d<=last.getDate();d++){
    const dateStr=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dt=new Date(y,m-1,d);
    const dow=dt.getDay();
    const hol=isHoliday(dt);
    const isToday=dateStr===todayStr();
    const isSel=dateStr===state.calSelectedDate;
    let cls='cd';
    if(isToday) cls+=' today';
    else if(isSel) cls+=' selected';
    if(hol||dow===0) cls+=' sun';
    else if(dow===6) cls+=' sat';

    const bars=(evByDate[dateStr]||[]).slice(0,3).map(ev=>`<div class="bar" style="background:${ev.color||'#43A047'};"></div>`).join('');
    html+=`<div class="${cls}" data-date="${dateStr}">
      <span class="dn">${d}</span>
      ${bars?`<div class="bars">${bars}</div>`:''}
    </div>`;
  }

  document.getElementById('cal-days').innerHTML=html;
  renderCalDetail(state.calSelectedDate);
}

function renderCalDetail(dateStr){
  const detail=document.getElementById('cal-detail');
  if(!dateStr){ detail.innerHTML=''; return; }
  const d=parseDateStr(dateStr);
  const dow=d.getDay();
  const hol=isHoliday(d);
  const holTxt=hol?'・祝':'';
  const isToday=dateStr===todayStr();
  let hdCls='cal-detail-hd';
  if(isToday) hdCls+=' today-hd';
  else if(hol||dow===0) hdCls+=' holiday-hd';
  else if(dow===6) hdCls+=' sat-hd';

  const events=getFilteredEvents().filter(e=>e.date===dateStr);
  let html=`<div class="${hdCls}">${d.getMonth()+1}/${d.getDate()}（${DOW_JA[dow]}${holTxt}）の予定</div>`;
  if(events.length===0){
    html+=`<div class="empty-msg" style="padding:16px 0;">予定はありません</div>`;
  } else {
    events.forEach(ev=>{
      const w=whoLabel(ev.who);
      html+=`<div class="ecard">
        <div class="ebar" style="background:${ev.color||'#43A047'};"></div>
        <div class="ebody">
          <div class="etitle">${ev.title}</div>
          <div class="emeta">${timeSlotLabel(ev)}</div>
        </div>
        <span class="ewho ${w.cls}">${w.label}</span>
      </div>`;
    });
  }
  detail.innerHTML=html;
}

// ===== 追加タブ 日付表示更新 =====
function updateAddDateBtn(){
  document.getElementById('add-date-btn').textContent=formatDateLabel(state.add.date);
}

// ===== 時間セレクト生成 =====
function buildTimeOptions(sel, includeEmpty=false){
  let html = includeEmpty ? '<option value="">未定</option>' : '<option value="" disabled selected>開始</option>';
  for(let h=0;h<24;h++){
    for(let min=0;min<60;min+=15){
      const val=`${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
      html+=`<option value="${val}">${val}</option>`;
    }
  }
  sel.innerHTML=html;
}
buildTimeOptions(document.getElementById('sel-start'),false);
buildTimeOptions(document.getElementById('sel-end'),true);

// ===== カレンダーモーダル =====
let modalCalMonth = state.calMonth;
function openDateModal(){
  const d=parseDateStr(state.add.date);
  modalCalMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  renderModalCal();
  document.getElementById('modal-date').classList.add('open');
}
function renderModalCal(){
  const [y,m]=modalCalMonth.split('-').map(Number);
  document.getElementById('modal-cal-month').textContent=`${y}年${m}月`;
  const first=new Date(y,m-1,1);
  const last=new Date(y,m,0);
  const startDow=first.getDay();
  let html='';
  for(let i=0;i<startDow;i++) html+=`<div class="cal-modal-day empty"></div>`;
  for(let d=1;d<=last.getDate();d++){
    const dateStr=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dt=new Date(y,m-1,d);
    const dow=dt.getDay();
    const hol=isHoliday(dt);
    const isToday=dateStr===todayStr();
    const isSel=dateStr===state.add.date;
    let cls='cal-modal-day';
    if(isSel) cls+=' selected';
    else if(isToday) cls+=' today';
    if(hol||dow===0) cls+=' sun hol';
    else if(dow===6) cls+=' sat';
    html+=`<div class="${cls}" data-date="${dateStr}">${d}</div>`;
  }
  document.getElementById('modal-cal-grid').innerHTML=html;
}
document.getElementById('modal-cal-prev').addEventListener('click',()=>{ const [y,m]=modalCalMonth.split('-').map(Number); const nd=new Date(y,m-2,1); modalCalMonth=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`; renderModalCal(); });
document.getElementById('modal-cal-next').addEventListener('click',()=>{ const [y,m]=modalCalMonth.split('-').map(Number); const nd=new Date(y,m,1); modalCalMonth=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`; renderModalCal(); });
document.getElementById('modal-cal-grid').addEventListener('click',e=>{ const d=e.target.closest('.cal-modal-day'); if(!d||!d.dataset.date) return; state.add.date=d.dataset.date; updateAddDateBtn(); document.getElementById('modal-date').classList.remove('open'); });
document.getElementById('modal-date').addEventListener('click',e=>{ if(e.target===document.getElementById('modal-date')) document.getElementById('modal-date').classList.remove('open'); });

// ===== フィルター =====
document.querySelector('.filter-btns').addEventListener('click',e=>{
  const btn=e.target.closest('.f-btn'); if(!btn) return;
  document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.filter=btn.dataset.who;
  if(state.view==='list') renderList(); else renderCalendar();
});

// ===== ビュー切替 =====
document.getElementById('btn-view-list').addEventListener('click',()=>{
  state.view='list';
  document.getElementById('btn-view-list').classList.add('active');
  document.getElementById('btn-view-cal').classList.remove('active');
  document.getElementById('view-list').style.display='';
  document.getElementById('view-calendar').style.display='none';
  renderList();
});
document.getElementById('btn-view-cal').addEventListener('click',()=>{
  state.view='calendar';
  document.getElementById('btn-view-cal').classList.add('active');
  document.getElementById('btn-view-list').classList.remove('active');
  document.getElementById('view-list').style.display='none';
  document.getElementById('view-calendar').style.display='flex';
  renderCalendar();
});

// ===== 月ナビ（リスト） =====
document.getElementById('list-prev').addEventListener('click',()=>{ const [y,m]=state.listMonth.split('-').map(Number); const nd=new Date(y,m-2,1); state.listMonth=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`; renderList(); });
document.getElementById('list-next').addEventListener('click',()=>{ const [y,m]=state.listMonth.split('-').map(Number); const nd=new Date(y,m,1); state.listMonth=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`; renderList(); });

// ===== 月ナビ（カレンダー） =====
document.getElementById('cal-prev').addEventListener('click',()=>{ const [y,m]=state.calMonth.split('-').map(Number); const nd=new Date(y,m-2,1); state.calMonth=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`; renderCalendar(); });
document.getElementById('cal-next').addEventListener('click',()=>{ const [y,m]=state.calMonth.split('-').map(Number); const nd=new Date(y,m,1); state.calMonth=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`; renderCalendar(); });

// ===== カレンダー日付タップ =====
document.getElementById('cal-days').addEventListener('click',e=>{ const cd=e.target.closest('.cd'); if(!cd||!cd.dataset.date) return; state.calSelectedDate=cd.dataset.date; renderCalendar(); });

// ===== タブ切替 =====
document.getElementById('tab-bar').addEventListener('click',e=>{ const tab=e.target.closest('.tab'); if(!tab) return; showTab(tab.dataset.tab); });

// ===== 追加タブ操作 =====
document.getElementById('add-date-btn').addEventListener('click',openDateModal);

// 繰り返しボタン
document.getElementById('rep-weekly').addEventListener('click',()=>{
  const btn=document.getElementById('rep-weekly');
  const active=btn.classList.toggle('active');
  if(active){ document.getElementById('rep-monthly').classList.remove('active'); state.add.repeat='weekly'; }
  else state.add.repeat='none';
});
document.getElementById('rep-monthly').addEventListener('click',()=>{
  const btn=document.getElementById('rep-monthly');
  const active=btn.classList.toggle('active');
  if(active){ document.getElementById('rep-weekly').classList.remove('active'); state.add.repeat='monthly'; }
  else state.add.repeat='none';
});

// 時間帯トグル
document.getElementById('tgl-timeslot').addEventListener('click',e=>{
  const t=e.target.closest('.tgl'); if(!t) return;
  document.querySelectorAll('#tgl-timeslot .tgl').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  state.add.timeSlot=t.dataset.val;
  document.getElementById('time-specific-row').style.display=t.dataset.val==='specific'?'flex':'none';
});

// 時間セレクト
document.getElementById('sel-start').addEventListener('change',e=>state.add.startTime=e.target.value);
document.getElementById('sel-end').addEventListener('change',e=>state.add.endTime=e.target.value);

// 誰の予定トグル
document.getElementById('tgl-who').addEventListener('click',e=>{
  const t=e.target.closest('.tgl'); if(!t) return;
  document.querySelectorAll('#tgl-who .tgl').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  state.add.who=t.dataset.val;
});

// 色選択
document.getElementById('color-row').addEventListener('click',e=>{
  const dot=e.target.closest('.cdot'); if(!dot) return;
  document.querySelectorAll('.cdot').forEach(d=>d.classList.remove('sel'));
  dot.classList.add('sel');
  state.add.color=dot.dataset.color;
});

// ===== 保存 =====
document.getElementById('btn-save').addEventListener('click',async()=>{
  const title=document.getElementById('add-title').value.trim();
  if(!title){ showToast('タイトルを入力してください'); return; }
  const data={
    title,
    date:state.add.date,
    who:state.add.who,
    timeSlot:state.add.timeSlot,
    color:state.add.color,
    repeat:state.add.repeat,
    memo:document.getElementById('add-memo').value.trim(),
    createdAt:Date.now()
  };
  if(state.add.timeSlot==='specific'){
    if(state.add.startTime) data.startTime=state.add.startTime;
    if(state.add.endTime) data.endTime=state.add.endTime;
  }
  try{
    await push(ref(db,`rooms/${state.roomId}/events`),data);
    showToast('保存しました ✓');
    // リセット
    document.getElementById('add-title').value='';
    document.getElementById('add-memo').value='';
    state.add.date=todayStr();
    state.add.timeSlot='unset';
    state.add.startTime='';
    state.add.endTime='';
    state.add.repeat='none';
    updateAddDateBtn();
    document.querySelectorAll('#tgl-timeslot .tgl').forEach((t,i)=>t.classList.toggle('active',i===0));
    document.getElementById('time-specific-row').style.display='none';
    document.getElementById('sel-start').value='';
    document.getElementById('sel-end').value='';
    document.getElementById('rep-weekly').classList.remove('active');
    document.getElementById('rep-monthly').classList.remove('active');
  }catch(e){ showToast('保存に失敗しました'); }
});

// ===== Firebase購読 =====
function subscribeRoom(roomId){
  onValue(ref(db,`rooms/${roomId}/events`),snap=>{
    state.events=snap.val()||{};
    if(state.view==='list') renderList(); else renderCalendar();
  });
  onValue(ref(db,`rooms/${roomId}/meta`),snap=>{
    if(!snap.exists()) return;
    state.meta=snap.val();
    updateNameBtns();
  });
}

// ===== トップ画面 =====
document.getElementById('btn-toggle-join').addEventListener('click',()=>document.getElementById('url-join-area').classList.toggle('open'));
document.getElementById('btn-join').addEventListener('click',()=>{
  const v=document.getElementById('input-join-url').value.trim();
  const m=v.match(/#([a-z0-9]{12})$/);
  if(!m){ showToast('URLの形式が正しくありません'); return; }
  location.href=v;
});
document.getElementById('btn-create').addEventListener('click',async()=>{
  const p1=document.getElementById('input-person1').value.trim();
  const p2=document.getElementById('input-person2').value.trim();
  if(!p1||!p2){ showToast('お二人の名前を入力してください'); return; }
  const roomId=generateRoomId();
  const meta={person1:p1,person2:p2,createdAt:Date.now()};
  try{
    await set(ref(db,`rooms/${roomId}/meta`),meta);
    state.roomId=roomId; state.meta=meta;
    localStorage.setItem('yote_room',roomId);
    location.hash=roomId;
    updateNameBtns(); updateAddDateBtn();
    subscribeRoom(roomId);
    showScreen('screen-main');
  }catch(e){ showToast('作成に失敗しました'); }
});

// ===== 起動 =====
async function init(){
  updateAddDateBtn();
  const hash=location.hash.replace('#','');
  if(hash&&/^[a-z0-9]{12}$/.test(hash)){
    try{
      const snap=await get(ref(db,`rooms/${hash}/meta`));
      if(snap.exists()){
        state.roomId=hash; state.meta=snap.val();
        localStorage.setItem('yote_room',hash);
        updateNameBtns(); updateAddDateBtn();
        subscribeRoom(hash);
        showScreen('screen-main');
        return;
      }
    }catch(e){ console.error(e); }
  }
  const saved=localStorage.getItem('yote_room');
  if(saved){
    try{
      const snap=await get(ref(db,`rooms/${saved}/meta`));
      if(snap.exists()){
        state.roomId=saved; state.meta=snap.val();
        location.hash=saved;
        updateNameBtns(); updateAddDateBtn();
        subscribeRoom(saved);
        showScreen('screen-main');
        return;
      }
    }catch(e){ console.error(e); }
  }
  showScreen('screen-top');
}

init();
</script>
